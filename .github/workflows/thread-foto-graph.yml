name: Update Thread Topic Graph

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Override LOOKBACK_DAYS for this run only"
        required: false
        type: string
      max_root_threads:
        description: "Override MAX_ROOT_THREADS for this run only (blank = no cap)"
        required: false
        type: string
      hard_cutoff_date:
        description: "Override HARD_CUTOFF_DATE for this run only (ISO 8601, e.g. 2026-10-13T00:00:00Z; blank = use the repo variable/no cutoff)"
        required: false
        type: string

# Avoid two runs racing to commit/push at the same time.
concurrency:
  group: thread-foto-graph
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Defense in depth alongside vision.py's own circuit breaker
    # (MAX_CONSECUTIVE_TRANSIENT_FAILURES): a normal run finishes in well
    # under an hour, so cap it far below GitHub's own 360-minute default to
    # bound worst-case cost/queue-blocking if Gemini is ever down for the
    # whole run.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN authenticates as the GitHub Actions
          # app, which the "Protect main" ruleset cannot exempt on a
          # personal (non-org) repo -- neither an Integration bypass actor
          # nor a bot User bypass actor is honored for GITHUB_TOKEN pushes
          # (confirmed by testing both). A fine-grained PAT scoped to just
          # this repo (Contents: Read and write), stored as the GH_PATH
          # secret, authenticates as the repo owner instead, who the
          # ruleset's Admin-role bypass actor does cover.
          token: ${{ secrets.GH_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # cache/*.json is gitignored (see .gitignore) -- it's local-only
      # derived state (described-photo IDs + the auto-refreshed Threads
      # token), not something we want committed to the public repo. On a
      # hosted runner there's no persistent disk between runs, so we use
      # actions/cache instead: restore-keys always finds the most recent
      # entry, and since `key` includes the run id it never hits on save,
      # so a fresh cache snapshot is saved every run. Entries expire after
      # 7 days unused or under LRU pressure past the repo's 10GB cache cap
      # (not a concern at our size); see README's "Security note"
      # for why this is acceptable despite caching a live access token
      # (short version: no pull_request trigger exists on this workflow,
      # which is the actual exposure vector for repo caches).
      - name: Restore local cache (vision descriptions + refreshed token)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: thread-foto-graph-cache-${{ github.run_id }}
          restore-keys: |
            thread-foto-graph-cache-

      - name: Run pipeline
        env:
          # Secrets: anything that grants access to an account/API.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Variables: everything else (not sensitive on its own, just
          # config) -- set these under Settings -> Secrets and variables ->
          # Actions -> Variables. `||` supplies the same defaults config.py
          # would use locally, since an unset Actions variable still
          # resolves to an empty string, which would otherwise override
          # config.py's own default.
          THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || '4' }}
          MAX_ROOT_THREADS: ${{ inputs.max_root_threads || vars.MAX_ROOT_THREADS }}
          MAX_VISION_REQUESTS_PER_RUN: ${{ vars.MAX_VISION_REQUESTS_PER_RUN || '1400' }}
          HARD_CUTOFF_DATE: ${{ inputs.hard_cutoff_date || vars.HARD_CUTOFF_DATE }}
        run: python -m src.main

      # actions/cache@v4's combined restore+save action only saves via an
      # auto-injected "post" step whose condition is effectively
      # `success()` -- it gets skipped the moment ANY later step in the job
      # fails, even one marked continue-on-error (confirmed live: runs
      # 38479574488 and 38483052187 both show "Post Restore local cache"
      # as skipped despite continue-on-error on the commit/push step).
      # Using the split actions/cache/save action with an explicit
      # `if: always()` step here -- placed right after the pipeline run,
      # before the commit/push step that might fail -- actually guarantees
      # the cache uploads regardless of what happens afterward.
      - name: Save local cache (vision descriptions + refreshed token)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: thread-foto-graph-cache-${{ github.run_id }}

      - name: Commit and push changes
        id: commit
        # continue-on-error so a push failure here doesn't skip the "Fail
        # job if commit/push ultimately failed" step below (which needs
        # steps.commit.outcome to inspect) or any later cleanup. The vision
        # cache itself is already safe regardless, via the dedicated
        # "Save local cache" step above.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/needs-reply.md data/needs-like.md data/actions.md data/topics.md data/threads data/history docs/graph.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update thread topic graph ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # main can move between this job's checkout and this push (e.g. a
          # concurrent manual run finishing first, or someone pushing
          # directly from a local clone -- the `concurrency:` block above
          # only serializes *other runs of this workflow*, it doesn't
          # protect against pushes from outside Actions). Retry with a
          # rebase instead of failing outright on a rejected push: these
          # commits only ever touch generated data files, so replaying our
          # commit on top of the latest main is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- main moved; rebasing onto the latest and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after multiple retries; main kept moving faster than we could rebase."
          exit 1

      - name: Fail job if commit/push ultimately failed
        # The vision cache is already safely saved by this point (the
        # explicit "Save local cache" step above ran right after the
        # pipeline, before this); this just makes sure a real push failure
        # still shows up as a failed run in the Actions UI/notifications,
        # instead of being silently swallowed by continue-on-error above.
        if: always() && steps.commit.outcome == 'failure'
        run: exit 1
