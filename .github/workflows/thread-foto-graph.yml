name: Update Thread Topic Graph

on:
  schedule:
    # GitHub Actions cron is UTC-only and not DST-aware, so this can't
    # directly express "8am-10pm Seattle, Mon-Fri". Instead it fires every
    # hour, every day, across a UTC window wide enough to cover 8am-10pm
    # Pacific under both PST (UTC-8) and PDT (UTC-7): 15:00 UTC = 8am PDT /
    # 7am PST, and 06:00 UTC = 10pm PST(-ish) / 11pm PDT. The "Check Seattle
    # business-hours window" step below then does the real, DST-aware
    # Mon-Fri/8am-10pm filtering in Python and skips the rest of the job
    # when outside it.
    - cron: "0 15-23,0-6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Override LOOKBACK_DAYS for this run only"
        required: false
        type: string
      max_root_threads:
        description: "Override MAX_ROOT_THREADS for this run only (blank = no cap)"
        required: false
        type: string

# Avoid two runs racing to commit/push at the same time.
concurrency:
  group: thread-foto-graph
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scheduled runs fire every hour all week (see the cron comment above)
      # -- this step is what actually enforces "Mon-Fri, 8am-10pm Seattle
      # time", correctly across PST/PDT, using the real current time rather
      # than a fixed UTC offset. Manual (workflow_dispatch) runs always
      # proceed regardless of time, since those are explicit/on-demand.
      - name: Check Seattle business-hours window (Mon-Fri 8am-10pm)
        id: window
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          is_scheduled = os.environ["EVENT_NAME"] == "schedule"
          in_window = now.weekday() < 5 and 8 <= now.hour < 22
          should_run = (not is_scheduled) or in_window
          print(f"Seattle local time: {now.isoformat()} (weekday={now.weekday()}, scheduled={is_scheduled})")
          print(f"should_run={should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # cache/*.json is gitignored (see .gitignore) -- it's local-only
      # derived state (described-photo IDs + the auto-refreshed Threads
      # token), not something we want committed to the public repo. On a
      # hosted runner there's no persistent disk between runs, so we use
      # actions/cache instead: restore-keys always finds the most recent
      # entry, and since `key` includes the run id it never hits on save,
      # so a fresh cache snapshot is saved every run. Entries expire after
      # 7 days unused or under LRU pressure past the repo's 10GB cache cap
      # (not a concern at our size/frequency); see README's "Security note"
      # for why this is acceptable despite caching a live access token
      # (short version: no pull_request trigger exists on this workflow,
      # which is the actual exposure vector for repo caches).
      - name: Restore local cache (vision descriptions + refreshed token)
        if: steps.window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: cache
          key: thread-foto-graph-cache-${{ github.run_id }}
          restore-keys: |
            thread-foto-graph-cache-

      - name: Run pipeline
        if: steps.window.outputs.should_run == 'true'
        env:
          # Secrets: anything that grants access to an account/API.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Variables: everything else (not sensitive on its own, just
          # config) -- set these under Settings -> Secrets and variables ->
          # Actions -> Variables. `||` supplies the same defaults config.py
          # would use locally, since an unset Actions variable still
          # resolves to an empty string, which would otherwise override
          # config.py's own default.
          THREADS_USERNAME: ${{ vars.THREADS_USERNAME }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || '2' }}
          MAX_ROOT_THREADS: ${{ inputs.max_root_threads || vars.MAX_ROOT_THREADS }}
          MAX_VISION_REQUESTS_PER_RUN: ${{ vars.MAX_VISION_REQUESTS_PER_RUN || '1400' }}
        run: python -m src.main

      - name: Commit and push changes
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/actions.md data/topics.md data/threads docs/graph.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update thread topic graph ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # main can move between this job's checkout and this push (e.g. a
          # concurrent manual run finishing first, or someone pushing
          # directly from a local clone -- the `concurrency:` block above
          # only serializes *other runs of this workflow*, it doesn't
          # protect against pushes from outside Actions). Retry with a
          # rebase instead of failing outright on a rejected push: these
          # commits only ever touch generated data files, so replaying our
          # commit on top of the latest main is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- main moved; rebasing onto the latest and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after multiple retries; main kept moving faster than we could rebase."
          exit 1
