<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thread Topic Graph</title>
  <script src="https://unpkg.com/vis-network@9/standalone/umd/vis-network.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #graph { width: 100%; height: 90vh; border-bottom: 1px solid #ccc; }
    #info { padding: 8px 16px; font-size: 14px; color: #333; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <div id="info">Thread Topic Graph — click a node to open the thread on Threads.</div>
  <div id="graph"></div>
  <script>
    fetch('graph.json')
      .then(r => r.json())
      .then(data => {
        const nodes = new vis.DataSet(data.nodes.map(n => ({
          id: n.id,
          label: `${n.label}\n${n.snippet}`,
          group: String(n.group),
          title: `${n.reply_count} repl(y/ies)`
        })));
        const edges = new vis.DataSet(data.edges);
        const network = new vis.Network(
          document.getElementById('graph'),
          { nodes, edges },
          { physics: { stabilization: true }, nodes: { shape: 'box' } }
        );
        network.on('click', params => {
          if (params.nodes.length) {
            const node = data.nodes.find(n => n.id === params.nodes[0]);
            if (node && node.permalink) window.open(node.permalink, '_blank');
          }
        });
      })
      .catch(err => {
        document.getElementById('info').textContent = 'Failed to load graph.json: ' + err;
      });
  </script>
</body>
</html>
