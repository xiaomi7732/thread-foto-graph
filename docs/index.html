<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thread Topic Graph</title>
  <script src="https://unpkg.com/vis-network@9/standalone/umd/vis-network.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #layout { display: flex; height: 100vh; }
    #graph { flex: 1 1 60%; border-right: 1px solid #ccc; }
    #detail { flex: 1 1 40%; overflow-y: auto; padding: 16px 20px; box-sizing: border-box; }
    #info { position: absolute; padding: 8px 16px; font-size: 13px; color: #333; background: rgba(255,255,255,0.85); }
    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .thread-text { font-size: 16px; margin: 4px 0 12px; }
    .photo { color: #6a4; font-style: italic; font-size: 13px; margin: 2px 0 8px 0; }
    .photo.pending { color: #b80; }
    ul.replies { list-style: none; padding-left: 0; margin: 0; }
    ul.replies li { border-top: 1px solid #eee; padding: 8px 0; }
    .username { font-weight: 600; }
    .placeholder { color: #888; }
    .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
    .badge-reply { background: #e3f0ff; color: #1a56c4; }
    .badge-like { background: #fdf1d8; color: #9a6b00; }
    .badge-hidden { background: #fde2e2; color: #a61b1b; }
    ul.nested { list-style: none; margin: 8px 0 0; padding-left: 18px; border-left: 2px solid #ddd; }
    ul.nested li { border-top: none; padding: 6px 0; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="graph"></div>
    <div id="detail"><p class="placeholder">Click a thread node to see its full text, permalink, replies, and photo descriptions.</p></div>
  </div>
  <div id="info">Thread Topic Graph — click a node for details, or the 🔗 link to open it on Threads.</div>
  <script>
    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function photosHtml(photos) {
      if (!photos || !photos.length) return '';
      return photos.map(photo => {
        const pending = photo.startsWith('(photo pending') || photo.startsWith('(description unavailable');
        return `<div class="photo${pending ? ' pending' : ''}">📷 ${escapeHtml(photo)}</div>`;
      }).join('');
    }

    function actionBadge(r) {
      if (r.hidden) return ' <span class="badge badge-hidden">🚫 hidden</span>';
      if (!r.needs_response) return '';
      return r.action === 'reply'
        ? ' <span class="badge badge-reply">💬 needs reply</span>'
        : ' <span class="badge badge-like">👍 needs like</span>';
    }

    // Renders a reply and recurses into its nested replies (real
    // reply-to-reply hierarchy, indented per depth via nested <ul class="nested">).
    function replyHtml(r) {
      const rlink = r.permalink ? ` <a href="${r.permalink}" target="_blank" rel="noopener">🔗</a>` : '';
      const children = (r.replies && r.replies.length)
        ? `<ul class="nested">${r.replies.map(replyHtml).join('')}</ul>`
        : '';
      return `<li>
        <span class="username">${escapeHtml(r.username)}</span>${rlink}${actionBadge(r)}
        <div>${escapeHtml(r.text) || '<span class="placeholder">(no text)</span>'}</div>
        ${photosHtml(r.photos)}
        ${children}
      </li>`;
    }

    function renderDetail(node) {
      const link = node.permalink
        ? ` <a href="${node.permalink}" target="_blank" rel="noopener">🔗 open thread</a>`
        : '';
      const repliesHtml = (node.replies || []).map(replyHtml).join('');

      document.getElementById('detail').innerHTML = `
        <h2 style="margin-top:0">${escapeHtml(node.label)}</h2>
        <div class="thread-text">${escapeHtml(node.text)}${link}</div>
        ${photosHtml(node.photos)}
        <h3>Replies (${node.reply_count !== undefined ? node.reply_count : (node.replies || []).length})</h3>
        <ul class="replies">${repliesHtml || '<li class="placeholder">No replies.</li>'}</ul>
      `;
    }

    fetch('graph.json')
      .then(r => r.json())
      .then(data => {
        const nodes = new vis.DataSet(data.nodes.map(n => ({
          id: n.id,
          label: `${n.label}\n${n.snippet}`,
          group: String(n.group),
          title: `${n.reply_count} repl(y/ies)`
        })));
        const edges = new vis.DataSet(data.edges);
        const network = new vis.Network(
          document.getElementById('graph'),
          { nodes, edges },
          { physics: { stabilization: true }, nodes: { shape: 'box' } }
        );
        network.on('click', params => {
          if (params.nodes.length) {
            const node = data.nodes.find(n => n.id === params.nodes[0]);
            if (node) renderDetail(node);
          }
        });
      })
      .catch(err => {
        document.getElementById('detail').textContent = 'Failed to load graph.json: ' + err;
      });
  </script>
</body>
</html>
